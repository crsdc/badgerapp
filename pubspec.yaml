name: badger
description: Badger Watch

publish_to: 'none'

environment:
  sdk: ">=2.12.0 <3.0.0"
  flutter: ">=3.3.9"

dependencies:
  flutter:
    sdk: flutter
    # Flutter 3.13.7
    # Android SDK version 34.0.0
    # Android Studio version 2022.3
  characters: ^1.2.0 # needs to be on old version because of flutter_test
  cupertino_icons: ^1.0.5
  #flutter_markdown: ^0.6.7
  fluttertoast: ^8.0.9
  get: ^4.6.5
  get_it: ^7.2.0
  google_fonts: ^3.0.1
  intl: ^0.17.0
  flutter_keyboard_visibility: ^5.4.0
  latlong_to_osgrid: ^1.3.2
  location: ^4.4.0
  material_design_icons_flutter: ^5.0.6996 # fixed version is recommended for this package because of icon changes
  modal_bottom_sheet: ^2.1.2
  #package_info_plus: ^1.4.3
  positioned_tap_detector_2: ^1.0.4 # added when flutter_map upgraded from 0.13.1 to 0.14.0
  path_provider: ^2.0.11
  path: ^1.8.1 # needs to be on old version because of flutter_test
  sembast: 3.3.0
  shared_preferences: ^2.0.15
  smooth_page_indicator: ^1.0.0+2
  url_launcher: ^6.1.6
  flutter_map: 3.0.0 # was ^2.2.0
  flutter_map_dragmarker: 4.1.2 # was ^3.1.0
  flutter_map_location_marker: ^5.0.0+1 # was ^4.1.4
  flutter_map_marker_popup: ^4.0.0
  flutter_map_tile_caching: ^6.2.0
  #latlng: ^0.1.0
  latlong2: ^0.8.1
  #user_location: any
  #flutter_map_location: any #^0.12.0
  #flutter_compass: ^0.7.0 # not used directly, but pubspec.lock sets it to 0.6.1 which gets a warning on compile for deprecated Android embedding
  what3words: ^3.1.0

dev_dependencies:
  flutter_launcher_icons: ^0.10.0
  flutter_lints: ^2.0.1
  #flutter_lints: ^2.0.1
  flutter_test:
    sdk: flutter

dependency_overrides:
  geolocator: 9.0.1
  geolocator_android: 4.1.4

flutter:
  uses-material-design: true
  fonts:
    - family: CutiveMono
      fonts:
        - asset: assets/fonts/CutiveMono-Regular.ttf
          weight: 400
    - family: RobotoMono
      fonts:
        - asset: assets/fonts/RobotoMono-Regular.ttf
          weight: 400
  assets:
    - assets/images/
    - assets/icons/

flutter_icons:
  android: true
  ios: true
  image_path: assets/icons/icon-base-1024.png

version: 1.7.2+17003 # S for code release

# Must also update version in config/dev.dart
